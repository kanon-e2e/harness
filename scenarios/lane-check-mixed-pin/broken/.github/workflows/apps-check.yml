# Checks each agent App in the register against its installation (docs/apps.md). Run it by hand:
#   gh workflow run apps-check.yml
# Left at an older release while the other callers moved: two Kanon versions in one repository.
name: apps-check

on:
  workflow_dispatch:

permissions: {}

jobs:
  apps:
    permissions:
      contents: read
    uses: yedeya-labs/kanon/.github/workflows/apps-check.yml@v0.40.2
    secrets:
      JUDGE_APP_ID: ${{ secrets.JUDGE_APP_ID }}
      JUDGE_APP_PRIVATE_KEY: ${{ secrets.JUDGE_APP_PRIVATE_KEY }}
