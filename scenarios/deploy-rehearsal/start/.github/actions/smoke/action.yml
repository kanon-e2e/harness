# The deploy lane's smoke hook, filled for the deploy rehearsal: it passes. The second release
# replaces it with one that fails (smoke-fails/), and the third puts this one back (smoke-passes/).
name: Deploy lane smoke hook
description: Checks the deployed system answers as the release expects.
inputs:
  environment:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  release:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  role:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
runs:
  using: composite
  steps:
    - name: Smoke
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: echo "Smoke passed for $ENVIRONMENT at $RELEASE"
