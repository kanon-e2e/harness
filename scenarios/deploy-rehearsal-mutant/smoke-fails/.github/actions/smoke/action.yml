# The deploy lane's smoke hook, as the deploy rehearsal's second release leaves it: it fails, so
# the lane's report job files the environment's issue. The third release puts the passing one back.
name: Deploy lane smoke hook
description: Checks the deployed system answers as the release expects.
inputs:
  environment:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  release:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  role:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
runs:
  using: composite
  steps:
    - name: Smoke, failing
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        echo "::error::the rehearsal's smoke check fails for $ENVIRONMENT at $RELEASE"
        exit 1
