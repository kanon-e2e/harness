# Proposed item 19, added after plan 0012 §12 (Kanon issue #968): which of doctor's checks
# can't run, or answer differently, on the read-only token plan 0012's `kanon` job will hold
# (decision 23 (b)).
# Mints a driver token for this repository only, with Contents, Issues, Administration,
# Actions and Pull requests read and nothing else (no Workflows, no Secrets, no write), clones
# this repository's `main` (which has adopted Kanon), and runs `kanon doctor --json` there at
# `kanon-ref`, as an adopter would, with GH_TOKEN set to that token. Lists the `unchecked`
# entries and the findings, keeps doctor's JSON as an artifact, and compares by hand with
# probe 09 (the driver's full token, 0 unchecked).
# Creates nothing outside the run: the token can't write, and the artifact holds doctor's
# JSON only.
name: probe-19 doctor on the kanon job's read-only token (item 19, proposed)

on:
  workflow_dispatch:
    inputs:
      kanon-ref:
        description: The Kanon release to run doctor from (vX.Y.Z or candidate-vX.Y.Z); the release the harness pins
        type: string
        default: candidate-v0.41.0

permissions: {}

concurrency:
  group: probe-19
  cancel-in-progress: false

jobs:
  probe:
    name: run doctor on the harness with a read-only token
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: e2e
    permissions: {}
    steps:
      - name: Check the inputs
        env:
          KANON_REF: ${{ inputs.kanon-ref }}
        run: |
          printf '%s' "$KANON_REF" | grep -Eq '^(candidate-)?v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::kanon-ref must be vX.Y.Z or candidate-vX.Y.Z"; exit 1; }

      - name: Mint the driver's token (this repository, decision 23 (b)'s five reads only)
        id: readonly
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DRIVER_APP_ID }}
          private-key: ${{ secrets.DRIVER_APP_KEY }}
          owner: kanon-e2e
          repositories: harness
          permission-contents: read
          permission-issues: read
          permission-administration: read
          permission-actions: read
          permission-pull-requests: read

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Clone the harness's main
        env:
          GH_TOKEN: ${{ steps.readonly.outputs.token }}
        run: |
          gh auth setup-git
          git clone --branch main "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/repo"
          echo "cloned $GITHUB_REPOSITORY at $(git -C "$RUNNER_TEMP/repo" rev-parse HEAD)"

      - name: Run doctor
        id: doctor
        working-directory: ${{ runner.temp }}/repo
        env:
          GH_TOKEN: ${{ steps.readonly.outputs.token }}
          KANON_REF: ${{ inputs.kanon-ref }}
        run: |
          set +e
          npx --yes --package "github:yedeya-labs/kanon#$KANON_REF" kanon doctor --json > "$RUNNER_TEMP/doctor.json" 2> "$RUNNER_TEMP/doctor.log"
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "doctor exited $code"
          if jq -e . "$RUNNER_TEMP/doctor.json" >/dev/null 2>&1; then
            echo "count=$(jq '.unchecked | length' "$RUNNER_TEMP/doctor.json")" >> "$GITHUB_OUTPUT"
            echo "unchecked ($(jq '.unchecked | length' "$RUNNER_TEMP/doctor.json")):"
            jq -r '.unchecked[]? | "  \(.check) \(.subject): \(.reason | gsub("\n"; " "))"' "$RUNNER_TEMP/doctor.json"
            echo "finding ids: $(jq -r '[.findings[]?.id] | group_by(.) | map("\(.[0]) x\(length)") | join(", ")' "$RUNNER_TEMP/doctor.json")"
          else
            echo "count=unreadable" >> "$GITHUB_OUTPUT"
            echo "doctor's output is not JSON; its log:"
            tail -n 20 "$RUNNER_TEMP/doctor.log"
          fi

      - name: Keep doctor's JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-19-doctor-json
          path: ${{ runner.temp }}/doctor.json
          if-no-files-found: warn
          retention-days: 30

      - name: Write the answer
        if: always()
        env:
          DOCTOR_EXIT: ${{ steps.doctor.outputs.exit }}
          COUNT: ${{ steps.doctor.outputs.count }}
          KANON_REF: ${{ inputs.kanon-ref }}
        run: |
          case "$DOCTOR_EXIT" in 0|1|4) ran=yes;; *) ran=no;; esac
          if [ "$ran" = yes ] && [ "$COUNT" != unreadable ]; then answer='**MEASURED**'; else answer='**INCONCLUSIVE**: doctor did not run to the end'; fi
          {
            echo "## Probe 19: doctor on the \`kanon\` job's read-only token"
            echo
            echo "| §12 item | Question | Measured | Answer |"
            echo "|---|---|---|---|"
            echo "| 19 (proposed) | Which doctor checks can't run, or answer differently, on the \`kanon\` job's read-only token? | Kanon $KANON_REF on \`$GITHUB_REPOSITORY\` main; token: Contents, Issues, Administration, Actions, Pull requests read; doctor exit ${DOCTOR_EXIT:-not run}; ${COUNT:-no} unchecked (probe 09, full driver token: 0) | $answer |"
            echo
            if [ "$ran" = yes ] && [ "$COUNT" != unreadable ]; then
              echo "| Check | Subject | Why doctor could not run it |"
              echo "|---|---|---|"
              jq -r '.unchecked[]? | "| `\(.check)` | `\(.subject)` | \(.reason | gsub("\\|"; "/") | gsub("\n"; " ")) |"' "$RUNNER_TEMP/doctor.json"
              echo
              echo "| Finding | Count |"
              echo "|---|---|"
              jq -r '[.findings[]?.id] | group_by(.) | map("| `\(.[0])` | \(length) |") | .[]' "$RUNNER_TEMP/doctor.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
