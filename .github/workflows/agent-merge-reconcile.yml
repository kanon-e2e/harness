# The caller of Kanon's agent-merge-reconcile lane, written by `kanon init` (docs/lanes.md). The triggers are yours;
# the rest is the lane's, and `lane-check` holds this file to it.
name: Merge Reconcile (Reviewer)

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged PR number to reconcile"
        required: true
      max_turns:
        description: "Raise the turn limit for this one dispatched run, a whole number from 1 to 60 (the lane's limit is 30). Only a caller's workflow_dispatch input may fill it, and it needs a reason. Kanon refuses anything else before any model call (docs/lanes.md, \"The turn budget\")."
        required: false
      reason:
        description: "Why this dispatched run raises max_turns: required when max_turns is set, and recorded in the run's summary (docs/lanes.md, \"The turn budget\")."
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  reconcile:
    uses: yedeya-labs/kanon/.github/workflows/agent-merge-reconcile.yml@candidate-v0.41.0
    with:
      pr_number: ${{ inputs.pr_number }}
      max_turns: ${{ inputs.max_turns }}
      reason: ${{ inputs.reason }}
    secrets:
      JUDGE_APP_ID: ${{ secrets.JUDGE_APP_ID }}
      JUDGE_APP_PRIVATE_KEY: ${{ secrets.JUDGE_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
