# Plan 0012 §12, item 15 (Kanon issue #968): an App installation token can be narrowed, at
# mint time, to a subset of the App's permissions and to one repository.
# Mints a driver token for this repository only, with Contents read and nothing else, and
# measures what it can do: the repositories it lists, a read (expected to work), and two
# writes the driver App holds but this token was not given (a label, Issues write; a branch,
# Contents write), each expected to be refused. A write that goes through is undone at once.
# Creates nothing that outlives the run.
name: probe-15 narrowing a token at mint time (item 15)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: probe-15
  cancel-in-progress: false

jobs:
  probe:
    name: mint a narrow token and test its edges
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: e2e
    permissions: {}
    steps:
      - name: Mint the driver's token (this repository, Contents read only)
        id: narrow
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DRIVER_APP_ID }}
          private-key: ${{ secrets.DRIVER_APP_KEY }}
          owner: kanon-e2e
          repositories: harness
          permission-contents: read

      - name: Measure the token and write the answer
        env:
          GH_TOKEN: ${{ steps.narrow.outputs.token }}
          LABEL: probe-15-${{ github.run_id }}
          BRANCH: probe-15-${{ github.run_id }}
        run: |
          code() { gh api -i "$@" 2>/dev/null | head -n1 | awk '{print $2}'; }
          repos=$(gh api "installation/repositories?per_page=100" --jq '"\(.total_count) (\(.repository_selection)): \([.repositories[].name] | join(", "))"' 2>/dev/null || echo unreadable)
          count=$(gh api "installation/repositories?per_page=100" --jq '[.total_count, .repository_selection] | @tsv' 2>/dev/null)
          read_status=$(code "repos/$GITHUB_REPOSITORY/contents/README.md")
          label_status=$(code -X POST "repos/$GITHUB_REPOSITORY/labels" -f name="$LABEL" -f color=ededed)
          [ "$label_status" = 201 ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/labels/$LABEL" >/dev/null 2>&1
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha 2>/dev/null)
          ref_status=$(code -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$head")
          [ "$ref_status" = 201 ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" >/dev/null 2>&1
          answer='**FAIL**'
          if [ "$count" = "$(printf '1\tselected')" ] && [ "$read_status" = 200 ] && [ "$label_status" = 403 ] && [ "$ref_status" = 403 ]; then answer='**PASS**'; fi
          {
            echo "## Probe 15: narrowing a token at mint time"
            echo
            echo "| §12 item | Question | Measured | Answer |"
            echo "|---|---|---|---|"
            echo "| 15 | Can an installation token be narrowed at mint time to one repository and a subset of the App's permissions? | repositories listed: $repos; read README HTTP ${read_status:-none} (want 200); create a label HTTP ${label_status:-none} (want 403); create a branch HTTP ${ref_status:-none} (want 403) | $answer |"
          } >> "$GITHUB_STEP_SUMMARY"
