# e2e — an `act` job: mint, then the job (Kanon plan 0012 §5.2; harness #16)
#
# CALLED ONLY BY `e2e.yml`, whose `act-1`, `act-2` and `act-3` call it, one scenario each. The
# same spine as `e2e-kanon-run.yml`:
#   • `mint` holds the driver's key and runs nothing else. It mints the WIDE token, scoped to the
#     one scenario repository: Contents, Workflows, Issues, Pull requests, Actions and
#     Administration write, Secrets and Checks read. That is what pushing Kanon's callers, opening
#     and merging pull requests, applying `init`'s settings (`repo.apply`, decision 23 (b)) and
#     ending the repository take.
#   • `job` is `e2e-act-job.yml`, handed the token and never the key. It runs the harness's code
#     only, never Kanon's: the `kanon` job's tree arrives as an artifact it takes as data.
name: e2e — an act job (mint, then the job)

on:
  workflow_call:
    inputs:
      scenario:
        description: The scenario's id
        required: true
        type: string
      phase:
        description: The phase, 1 to 3
        required: true
        type: number
      release:
        description: The Kanon release under test
        required: true
        type: string
      trigger:
        description: nightly, candidate or dispatch
        required: true
        type: string
      repository-name:
        description: The scenario repository's name in the test organisation
        required: true
        type: string
    secrets:
      DRIVER_APP_ID:
        required: true
      DRIVER_APP_KEY:
        required: true

jobs:
  # HOLDS THE KEY, AND ONLY THE MINT.
  mint:
    name: mint (the act token)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: e2e
    permissions: {}
    outputs:
      sealed: ${{ steps.seal.outputs.sealed }}
      # The attempt this token was minted for. A partial re-run reuses this job's outputs.
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Mint the driver's token for the scenario repository
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DRIVER_APP_ID }}
          private-key: ${{ secrets.DRIVER_APP_KEY }}
          owner: kanon-e2e
          repositories: ${{ inputs.repository-name }}
          # The job revokes it when it ends. The default would revoke it as THIS job ends.
          skip-token-revoke: "true"
          permission-contents: write
          permission-workflows: write
          permission-issues: write
          permission-pull-requests: write
          permission-actions: write
          permission-administration: write
          permission-secrets: read
          permission-checks: read
      - name: Seal the token for the job
        id: seal
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: printf 'sealed=%s\n' "$(printf %s "$TOKEN" | od -An -v -tx1 | tr -d ' \n')" >> "$GITHUB_OUTPUT"

  # THE JOB, GIVEN THE TOKEN AND NEVER THE KEY. `!cancelled()`: a failed mint still reaches it,
  # and it fails by name.
  job:
    needs: mint
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/e2e-act-job.yml
    with:
      scenario: ${{ inputs.scenario }}
      phase: ${{ inputs.phase }}
      release: ${{ inputs.release }}
      trigger: ${{ inputs.trigger }}
      repository-name: ${{ inputs.repository-name }}
      mint-attempt: ${{ needs.mint.outputs.attempt }}
    secrets:
      app-token: ${{ needs.mint.outputs.sealed }}
