# e2e — the Author's dispatch (harness #123; the Owner, 2026-10-25)
#
# CALLED ONLY BY `e2e-author-dispatch-run.yml`. One job, three steps and nothing else: receive the
# Author's token, dispatch the scenario repository's `workflow` on its default branch, revoke the
# token. No checkout, no harness code, no Kanon code: nothing runs beside the token but `gh`.
# `e2e.yml` runs it only for a scenario `gate-2` kept, so not for one phase 1 ended. Should one end
# between the gate and here, its repository is archived (`fail`), and the job dispatches nothing
# and says so; the scenario's result is already set.
name: e2e — the Author's dispatch

on:
  workflow_call:
    inputs:
      repository-name:
        required: true
        type: string
      workflow:
        required: true
        type: string
      mint-attempt:
        description: The run attempt the `mint` job minted the token for; a token of an earlier attempt is refused by name.
        required: true
        type: string
    secrets:
      app-token:
        description: The Author's token, hex-encoded by the `mint` job.
        required: true

jobs:
  dispatch:
    name: dispatch the workflow as the Author
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Receive the App token
        id: app-token
        env:
          SEALED: ${{ secrets.app-token }}
          MINT_ATTEMPT: ${{ inputs.mint-attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "$SEALED" ] || ! printf %s "$SEALED" | grep -Eq '^([0-9a-f]{2})+$'; then
            echo "::error title=app-token::no App token arrived from the mint job; see that job's log for why the mint failed."
            exit 1
          fi
          if [ "$MINT_ATTEMPT" != "$RUN_ATTEMPT" ]; then
            echo "::error title=app-token::this is attempt $RUN_ATTEMPT, but the App token was minted for attempt $MINT_ATTEMPT and revoked when that attempt ended. Use \"Re-run all jobs\"."
            exit 1
          fi
          TOKEN="$(printf '%b' "$(printf %s "$SEALED" | sed 's/../\\x&/g')")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Dispatch the workflow on the default branch, as the Author
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: kanon-e2e/${{ inputs.repository-name }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          set -euo pipefail
          if ! printf %s "$WORKFLOW" | grep -Eq '^[A-Za-z0-9._-]+\.ya?ml$'; then
            echo "::error title=author-dispatch::\`$WORKFLOW\` is not a workflow's file name"
            exit 1
          fi
          repo=$(gh api "repos/$REPOSITORY" --jq '[.archived, .default_branch] | @tsv')
          if [ "${repo%%$'\t'*}" = "true" ]; then
            echo "::notice title=author-dispatch::$REPOSITORY is archived: the scenario already failed, so nothing is dispatched."
            exit 0
          fi
          branch=${repo#*$'\t'}
          gh api -X POST "repos/$REPOSITORY/actions/workflows/$WORKFLOW/dispatches" -f "ref=$branch" >/dev/null
          echo "Dispatched $WORKFLOW on $branch in $REPOSITORY, as the Author."

      - name: Revoke the App token
        if: ${{ always() }}
        env:
          SEALED: ${{ secrets.app-token }}
          MINT_ATTEMPT: ${{ inputs.mint-attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          API_URL: ${{ github.api_url }}
        run: |
          if [ -z "$SEALED" ] || ! printf %s "$SEALED" | grep -Eq '^([0-9a-f]{2})+$' || [ "$MINT_ATTEMPT" != "$RUN_ATTEMPT" ]; then
            echo "No App token of this attempt to revoke"
            exit 0
          fi
          TOKEN="$(printf '%b' "$(printf %s "$SEALED" | sed 's/../\\x&/g')")"
          echo "::add-mask::$TOKEN"
          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/installation/token" || true)"
          if [ "$STATUS" = "204" ]; then echo "App token revoked"; else echo "::warning title=app-token::the App token could not be revoked (HTTP ${STATUS:-none}); it expires within the hour"; fi
