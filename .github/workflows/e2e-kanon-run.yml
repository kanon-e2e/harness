# e2e — a `kanon` job: mint, then the job (Kanon plan 0012 §5.2; harness #16)
#
# CALLED ONLY BY `e2e.yml`, whose `kanon-1`, `kanon-2` and `kanon-3` call it, one scenario each.
# Two jobs, the spine Kanon's own lanes use (Kanon's overseer-run.yml, `K-AGENT-49`):
#   • `mint` holds the driver's key and runs nothing else: no checkout, no harness code, no
#     Kanon code. It mints a token scoped to the one scenario repository, READ-ONLY (decision
#     23 (b)): Contents, Issues, Pull requests, Actions and Administration read; no Workflows, no
#     Secrets, no write at all. It hands the token on hex-encoded, because GitHub drops a job
#     output that holds a masked value, and skips the revoke, which the job does as it ends.
#   • `job` is `e2e-kanon-job.yml`, handed the token and never the key. It runs Kanon's code at
#     the release under test, which reaches only that token: whatever Kanon writes, it writes to
#     its clone, and the `act` job pushes it.
name: e2e — a kanon job (mint, then the job)

on:
  workflow_call:
    inputs:
      scenario:
        description: The scenario's id
        required: true
        type: string
      phase:
        description: The phase, 1 to 3
        required: true
        type: number
      release:
        description: The Kanon release under test
        required: true
        type: string
      trigger:
        description: nightly, candidate or dispatch
        required: true
        type: string
      repository-name:
        description: The scenario repository's name in the test organisation
        required: true
        type: string
    secrets:
      DRIVER_APP_ID:
        required: true
      DRIVER_APP_KEY:
        required: true

jobs:
  # HOLDS THE KEY, AND ONLY THE MINT.
  mint:
    name: mint (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: e2e
    permissions: {}
    outputs:
      sealed: ${{ steps.seal.outputs.sealed }}
      # The attempt this token was minted for. A partial re-run reuses this job's outputs.
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Mint the driver's read-only token for the scenario repository
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DRIVER_APP_ID }}
          private-key: ${{ secrets.DRIVER_APP_KEY }}
          owner: kanon-e2e
          repositories: ${{ inputs.repository-name }}
          # The job revokes it when it ends. The default would revoke it as THIS job ends.
          skip-token-revoke: "true"
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read
          permission-administration: read
      - name: Seal the token for the job
        id: seal
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: printf 'sealed=%s\n' "$(printf %s "$TOKEN" | od -An -v -tx1 | tr -d ' \n')" >> "$GITHUB_OUTPUT"

  # THE JOB, GIVEN THE TOKEN AND NEVER THE KEY. `!cancelled()`: a failed mint still reaches it,
  # and it fails by name.
  job:
    needs: mint
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/e2e-kanon-job.yml
    with:
      scenario: ${{ inputs.scenario }}
      phase: ${{ inputs.phase }}
      release: ${{ inputs.release }}
      trigger: ${{ inputs.trigger }}
      repository-name: ${{ inputs.repository-name }}
      mint-attempt: ${{ needs.mint.outputs.attempt }}
    secrets:
      app-token: ${{ needs.mint.outputs.sealed }}
