# e2e — the Author's label: mint, then the job (Kanon plan 0012 §6.2, E10; the Owner, 2026-10-20)
#
# CALLED ONLY BY `e2e.yml`'s `author-label`, after phase 1, once for each scenario whose
# scenario.json names an `authorLabel`. A model lane starts only on an event whose actor is a
# member or a registered agent App (Kanon's `scripts/lane-gate.mjs`, K-AGENT-45), and the driver is
# neither. So the test Author, which the scenario's App register names, applies the label, as an
# adopter's Implementer labels its own pull request. The same spine as the other pairs:
#   • `mint` holds the Author's key and runs nothing else. It mints a token scoped to the one
#     scenario repository with Issues and Pull requests write, and nothing more. Either alone may
#     be enough to label a pull request; until a live mint shows which, both stay, and
#     docs/jobs.md names what a leak of them can do (#108).
#   • `job` is `e2e-author-label-job.yml`, one job, handed the token and nothing else: `gh` applies
#     the label, and the token is revoked. No checkout, no harness code, no Kanon code (K-AGENT-50).
# THE PLAN CHANGES HERE (§5.2, §11): the test Apps' keys are read by `provision`, by this
# `mint`, and by `e2e-author-dispatch-run.yml`'s `mint` (#123). This one reads only the Author's.
name: e2e — the Author's label (mint, then the job)

on:
  workflow_call:
    inputs:
      repository-name:
        description: The scenario repository's name in the test organisation
        required: true
        type: string
      head:
        description: The branch of the open pull request to label
        required: true
        type: string
      label:
        description: The label the Author applies
        required: true
        type: string
    secrets:
      AUTHOR_APP_ID:
        required: true
      AUTHOR_APP_KEY:
        required: true

jobs:
  # HOLDS THE KEY, AND ONLY THE MINT.
  mint:
    name: mint (Issues and Pull requests write, as the Author)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: e2e
    permissions: {}
    outputs:
      sealed: ${{ steps.seal.outputs.sealed }}
      # The attempt this token was minted for. A partial re-run reuses this job's outputs.
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Mint the Author's token for the scenario repository
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTHOR_APP_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
          owner: kanon-e2e
          repositories: ${{ inputs.repository-name }}
          # The job revokes it when it ends. The default would revoke it as THIS job ends.
          skip-token-revoke: "true"
          permission-issues: write
          permission-pull-requests: write
      - name: Seal the token for the job
        id: seal
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: printf 'sealed=%s\n' "$(printf %s "$TOKEN" | od -An -v -tx1 | tr -d ' \n')" >> "$GITHUB_OUTPUT"

  # THE JOB, GIVEN THE TOKEN AND NEVER THE KEY.
  job:
    needs: mint
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/e2e-author-label-job.yml
    with:
      repository-name: ${{ inputs.repository-name }}
      head: ${{ inputs.head }}
      label: ${{ inputs.label }}
      mint-attempt: ${{ needs.mint.outputs.attempt }}
    secrets:
      app-token: ${{ needs.mint.outputs.sealed }}
