# The caller of Kanon's agent-project-digest lane, written by `kanon init` (docs/lanes.md). The triggers are yours;
# the rest is the lane's, and `lane-check` holds this file to it.
name: Daily project digest

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "'true' to print the message instead of posting it, and file nothing"
        required: false
      max_turns:
        description: "Raise the turn limit for this one dispatched run, a whole number from 1 to 40 (the lane's limit is 20). Only a caller's workflow_dispatch input may fill it, and it needs a reason. Kanon refuses anything else before any model call (docs/lanes.md, \"The turn budget\")."
        required: false
      reason:
        description: "Why this dispatched run raises max_turns: required when max_turns is set, and recorded in the run's summary (docs/lanes.md, \"The turn budget\")."
        required: false

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  digest:
    uses: yedeya-labs/kanon/.github/workflows/agent-project-digest.yml@candidate-v0.41.0
    with:
      dry_run: ${{ inputs.dry_run }}
      max_turns: ${{ inputs.max_turns }}
      reason: ${{ inputs.reason }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      KANON_CHAT_PROJECT_DIGEST: ${{ secrets.KANON_CHAT_PROJECT_DIGEST }}
