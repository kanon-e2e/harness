# The caller of Kanon's agent-overseer lane, written by `kanon init` (docs/lanes.md). The triggers are yours;
# the rest is the lane's, and `lane-check` holds this file to it.
name: Overseer (Overseer)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      max_turns:
        description: "Raise the turn limit for this one dispatched run, a whole number from 1 to 160 (the lane's limit is 80). Only a caller's workflow_dispatch input may fill it, and it needs a reason. Kanon refuses anything else before any model call (docs/lanes.md, \"The turn budget\")."
        required: false
      reason:
        description: "Why this dispatched run raises max_turns: required when max_turns is set, and recorded in the run's summary (docs/lanes.md, \"The turn budget\")."
        required: false
  # The runtime-version trigger: a merged pull request that moves this file's Kanon pin. It audits
  # only where docs/qa/adoption.md turns the capability watch on, under ## Choices:
  # `- **Capability watch:** `on``. Off, Kanon's default, it runs a short gate job and skips (kanon#477).
  pull_request_target:
    types: [closed]
    branches: [main]
    paths:
      - .github/workflows/agent-overseer.yml

permissions:
  actions: write
  contents: read
  id-token: write
  issues: read

jobs:
  oversee:
    uses: yedeya-labs/kanon/.github/workflows/agent-overseer.yml@candidate-v0.41.0
    with:
      max_turns: ${{ inputs.max_turns }}
      reason: ${{ inputs.reason }}
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      KANON_TELEMETRY_READER_ROLE: ${{ secrets.KANON_TELEMETRY_READER_ROLE }}
      QA_STORE_BUCKET: ${{ secrets.QA_STORE_BUCKET }}
      QA_STORE_ROLE_ARN: ${{ secrets.QA_STORE_ROLE_ARN }}
