# The caller of Kanon's agent-lead lane, written by `kanon init` (docs/lanes.md). The triggers are yours;
# the rest is the lane's, and `lane-check` holds this file to it.
name: Lead (Lead) — brief

on:
  workflow_dispatch:
    inputs:
      mandate:
        description: "What to plan — one paragraph, in your own words"
        required: true
      context:
        description: "Issue numbers this covers, comma-separated (optional)"
        required: false
      max_turns:
        description: "Raise the turn limit for this one dispatched run, a whole number from 1 to 240 (the lane's limit is 120). Only a caller's workflow_dispatch input may fill it, and it needs a reason. Kanon refuses anything else before any model call (docs/lanes.md, \"The turn budget\")."
        required: false
      reason:
        description: "Why this dispatched run raises max_turns: required when max_turns is set, and recorded in the run's summary (docs/lanes.md, \"The turn budget\")."
        required: false

permissions:
  contents: read

jobs:
  brief:
    uses: yedeya-labs/kanon/.github/workflows/agent-lead.yml@v0.42.0
    with:
      mandate: ${{ inputs.mandate }}
      context: ${{ inputs.context }}
      max_turns: ${{ inputs.max_turns }}
      reason: ${{ inputs.reason }}
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
