# Plan 0012 §12, item 4 (Kanon issue #968): repository creation is held by a secondary rate
# limit well above two runs' count together (about 40 to 80 repositories in an hour).
# Creates empty public repositories, e2e-probe-04-<run>-<n>, one at a time, in waves that
# double (1, 2, 4, 8, ...) with a 10-second pause between waves. It stops at the first
# secondary-rate-limit response, at any other error, or at `max-repos`, whichever comes first,
# and an always() step deletes every repository whose name carries this run's prefix.
name: probe-04 repository creation rate limit (item 4)

on:
  workflow_dispatch:
    inputs:
      max-repos:
        description: Most repositories to create (1 to 80)
        type: number
        default: 20

permissions: {}

concurrency:
  group: probe-04
  cancel-in-progress: false

env:
  ORG: kanon-e2e

jobs:
  probe:
    name: ramp repository creation
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: e2e
    permissions: {}
    env:
      PREFIX: e2e-probe-04-${{ github.run_id }}-${{ github.run_attempt }}-
      MAX_REPOS: ${{ inputs.max-repos }}
    steps:
      - name: Check the cap
        run: |
          case "$MAX_REPOS" in ''|*[!0-9]*) echo "::error::max-repos must be a whole number from 1 to 80"; exit 1;; esac
          if [ "$MAX_REPOS" -lt 1 ] || [ "$MAX_REPOS" -gt 80 ]; then echo "::error::max-repos must be from 1 to 80, not $MAX_REPOS"; exit 1; fi

      - name: Mint the driver's organisation token (Administration write)
        id: org
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DRIVER_APP_ID }}
          private-key: ${{ secrets.DRIVER_APP_KEY }}
          owner: kanon-e2e
          permission-administration: write

      - name: Create repositories in doubling waves until a limit or the cap
        id: ramp
        env:
          GH_TOKEN: ${{ steps.org.outputs.token }}
        run: |
          cd "$RUNNER_TEMP"
          start=$(date -u +%s); n=0; wave=1; stop=cap; first_limit=""; retry_after=""; message=""
          : > created.tsv
          while [ "$n" -lt "$MAX_REPOS" ]; do
            for _ in $(seq 1 "$wave"); do
              [ "$n" -ge "$MAX_REPOS" ] && break
              n=$((n + 1)); name="$PREFIX$n"
              gh api -i -X POST "orgs/$ORG/repos" -f name="$name" -F private=false \
                -f description="Kanon e2e probe 04; the run that made it deletes it" > out 2>/dev/null || true
              tr -d '\r' < out > out.clean
              status=$(head -n1 out.clean | awk '{print $2}')
              printf '%s\t%s\t%s\n' "$n" "$(( $(date -u +%s) - start ))" "${status:-none}" >> created.tsv
              if [ "$status" = 201 ]; then continue; fi
              n=$((n - 1))
              message=$(tail -n1 out.clean | jq -r '.message // empty' 2>/dev/null | cut -c1-200)
              retry_after=$(awk -F': ' 'tolower($1)=="retry-after"{print $2}' out.clean)
              if { [ "$status" = 403 ] || [ "$status" = 429 ]; } && { [ -n "$retry_after" ] || printf '%s' "$message" | grep -qi 'secondary rate limit'; }; then
                stop=secondary-limit; first_limit="$status"
              else
                stop="error HTTP ${status:-none}"
              fi
              break 2
            done
            wave=$((wave * 2)); sleep 10
          done
          elapsed=$(( $(date -u +%s) - start ))
          {
            echo "created=$n"; echo "elapsed=$elapsed"; echo "stop=$stop"
            echo "limit-status=$first_limit"; echo "retry-after=$retry_after"; echo "message=$message"
          } >> "$GITHUB_OUTPUT"
          echo "created $n in $elapsed s; stopped: $stop"
          [ "$stop" = cap ] || [ "$stop" = secondary-limit ]

      - name: Delete every repository this run created
        id: cleanup
        if: always() && steps.org.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.org.outputs.token }}
        run: |
          left=0; deleted=0
          # The names this run recorded as created, and any the organisation lists with its prefix
          # (a listing can lag a creation, and a cancelled ramp may not have recorded its last one).
          recorded=$(awk -F'\t' -v p="$PREFIX" '$3 == "201" {print p $1}' "$RUNNER_TEMP/created.tsv" 2>/dev/null || true)
          listed=$(gh api --paginate "orgs/$ORG/repos?type=all&per_page=100" --jq '.[].name' 2>/dev/null | grep "^$PREFIX" || true)
          names=$(printf '%s\n%s\n' "$recorded" "$listed" | grep -v '^$' | sort -u || true)
          for name in $names; do
            ok=no
            for attempt in 1 2 3 4 5; do
              status=$(gh api -i -X DELETE "repos/$ORG/$name" 2>/dev/null | head -n1 | awk '{print $2}')
              if [ "$status" = 204 ] || [ "$status" = 404 ]; then ok=yes; break; fi
              echo "delete $name: HTTP ${status:-none}, attempt $attempt; waiting 60 s"; sleep 60
            done
            if [ "$ok" = yes ]; then deleted=$((deleted + 1)); else left=$((left + 1)); echo "::error::could not delete $ORG/$name"; fi
          done
          echo "deleted=$deleted" >> "$GITHUB_OUTPUT"; echo "left=$left" >> "$GITHUB_OUTPUT"
          echo "deleted $deleted; left $left"
          [ "$left" -eq 0 ]

      - name: Write the answer
        if: always()
        env:
          CREATED: ${{ steps.ramp.outputs.created }}
          ELAPSED: ${{ steps.ramp.outputs.elapsed }}
          STOP: ${{ steps.ramp.outputs.stop }}
          LIMIT_STATUS: ${{ steps.ramp.outputs.limit-status }}
          RETRY_AFTER: ${{ steps.ramp.outputs.retry-after }}
          MESSAGE: ${{ steps.ramp.outputs.message }}
          DELETED: ${{ steps.cleanup.outputs.deleted }}
          LEFT: ${{ steps.cleanup.outputs.left }}
        run: |
          if [ "$STOP" = secondary-limit ]; then
            answer='**FAIL**'; why="a secondary limit after $CREATED repositories, under the 80 the plan needs"
          elif [ "$STOP" = cap ] && [ "${CREATED:-0}" -ge 80 ]; then
            answer='**PASS**'; why="no limit up to 80; 80 is a lower bound, not the limit itself"
          elif [ "$STOP" = cap ]; then
            answer='**INCONCLUSIVE**'; why="no limit up to the cap of $CREATED; run with max-repos 80 to answer"
          else
            answer='**INCONCLUSIVE**'; why="stopped by an error that is not a rate limit: ${STOP:-the step did not run}"
          fi
          {
            echo "## Probe 04: repository creation rate limit"
            echo
            echo "| §12 item | Question | Measured | Answer |"
            echo "|---|---|---|---|"
            echo "| 4 | Is repository creation held by a secondary rate limit well above 40 to 80 repositories in an hour? | ${CREATED:-0} created in ${ELAPSED:-?} s; stopped: ${STOP:-not run}${LIMIT_STATUS:+, HTTP $LIMIT_STATUS}${RETRY_AFTER:+, retry-after $RETRY_AFTER s}${MESSAGE:+, \"$MESSAGE\"} | $answer: $why |"
            echo
            echo "Cleanup: ${DELETED:-0} deleted, ${LEFT:-unknown} left. Anything left is named \`$PREFIX<n>\`; the next run's cleanup does not see it, so delete it by hand."
          } >> "$GITHUB_STEP_SUMMARY"
