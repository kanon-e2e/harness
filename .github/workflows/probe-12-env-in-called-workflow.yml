# Plan 0012 §12, item 12 (Kanon issue #968): a job inside a called workflow can declare an
# environment and read that environment's secrets (a calling job can't declare one), and the
# environment's deployment policy applies to it.
# This caller holds nothing itself: it maps the driver's id and key by name, and the called
# job resolves them from its own environment (Kanon #1049). Its one call runs probe-12-env-in-called-workflow-job.yml, whose
# one job declares `environment: e2e`, checks the driver's id and key are there without
# printing them, and proves the key by minting a read-only token with it. Creates nothing.
# Dispatch it twice (probes/README.md): from `main`, the job must read the secrets; from any
# other branch, the environment's branch policy must refuse the job.
name: probe-12 environment in a called workflow (item 12)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: probe-12-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  call:
    name: call the -job workflow
    permissions: {}
    uses: ./.github/workflows/probe-12-env-in-called-workflow-job.yml
    secrets:
      DRIVER_APP_ID: ${{ secrets.DRIVER_APP_ID }}
      DRIVER_APP_KEY: ${{ secrets.DRIVER_APP_KEY }}

  report:
    name: write the answer
    needs: call
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write the answer
        env:
          RESULT: ${{ needs.call.result }}
          ID_PRESENT: ${{ needs.call.outputs.id-present }}
          KEY_PRESENT: ${{ needs.call.outputs.key-present }}
          MINTED: ${{ needs.call.outputs.minted }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$REF" = main ]; then
            expected="the job runs and reads both secrets"
            if [ "$RESULT" = success ] && [ "$ID_PRESENT" = yes ] && [ "$KEY_PRESENT" = yes ] && [ "$MINTED" = yes ]; then answer='**PASS**'; else answer='**FAIL**'; fi
          else
            expected="the branch policy refuses the job before any step, so no secret is read"
            if [ "$RESULT" = failure ] && [ -z "$ID_PRESENT$KEY_PRESENT$MINTED" ]; then answer='**PASS**'; else answer='**FAIL**'; fi
          fi
          {
            echo "## Probe 12: an environment declared inside a called workflow (dispatched from \`$REF\`)"
            echo
            echo "| §12 item | Question | Measured | Answer |"
            echo "|---|---|---|---|"
            echo "| 12 | Can a job inside a called workflow declare an environment and read its secrets, under the environment's deployment policy? | called job: ${RESULT:-unknown}; id present: ${ID_PRESENT:-not read}; key present: ${KEY_PRESENT:-not read}; minted with them: ${MINTED:-not tried}. Expected from \`$REF\`: $expected | $answer |"
            echo
            echo "Item 12 needs both runs: one from \`main\` and one from another branch (probes/README.md). A refusal shows on the called job as \"Branch ... is not allowed to deploy to e2e\"."
          } >> "$GITHUB_STEP_SUMMARY"
