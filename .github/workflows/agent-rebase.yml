# The caller of Kanon's agent-rebase lane, written by `kanon init` (docs/lanes.md). The triggers are yours;
# the rest is the lane's, and `lane-check` holds this file to it.
name: Rebase (Implementer)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A merged pull request: through a merge queue, the CI run on a merge is the queue's, which
  # the lane's gate turns away. The lane reads nothing of the pull request (docs/lanes.md).
  pull_request_target:
    types: [closed]
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "A single PR to consider (blank = every open PR)"
        required: false
      max_turns:
        description: "Raise the turn limit for this one dispatched run, a whole number from 1 to 240 (the lane's limit is 120). Only a caller's workflow_dispatch input may fill it, and it needs a reason. Kanon refuses anything else before any model call (docs/lanes.md, \"The turn budget\")."
        required: false
      reason:
        description: "Why this dispatched run raises max_turns: required when max_turns is set, and recorded in the run's summary (docs/lanes.md, \"The turn budget\")."
        required: false

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  rebase:
    uses: yedeya-labs/kanon/.github/workflows/agent-rebase.yml@v0.42.0
    with:
      pr_number: ${{ inputs.pr_number }}
      max_turns: ${{ inputs.max_turns }}
      reason: ${{ inputs.reason }}
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
