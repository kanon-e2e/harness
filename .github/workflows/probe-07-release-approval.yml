# Plan 0012 §12, item 7 (Kanon issue #968): the Owner, as required reviewer, can approve an
# environment job of a run whose release the test Releaser published, with "Prevent
# self-review" on.
# THE OWNER'S CLICK IS THE MANUAL STEP (probes/README.md). The workflow sets it up and waits:
# it creates e2e-probe-07-<run>-<attempt> with a release-triggered workflow whose one job
# declares the environment `probe-07` (the reviewer, "Prevent self-review" on), has the test
# Releaser publish a release, links the waiting run in a notice, and polls for `wait-minutes`
# for the approval. An always() step deletes the repository.
name: probe-07 Owner approves the Releaser's deploy (item 7)

on:
  workflow_dispatch:
    inputs:
      reviewer:
        description: The required reviewer, who approves (the Owner's login)
        type: string
        default: yedeya
      wait-minutes:
        description: How long to wait for the approval (5 to 45)
        type: number
        default: 30

permissions: {}

concurrency:
  group: probe-07
  cancel-in-progress: false

env:
  ORG: kanon-e2e

jobs:
  probe:
    name: set up, wait for the approval, clean up
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: e2e
    permissions: {}
    env:
      REPO_NAME: e2e-probe-07-${{ github.run_id }}-${{ github.run_attempt }}
      REVIEWER: ${{ inputs.reviewer }}
      WAIT_MINUTES: ${{ inputs.wait-minutes }}
    steps:
      - name: Check the inputs
        run: |
          case "$WAIT_MINUTES" in ''|*[!0-9]*) echo "::error::wait-minutes must be a whole number"; exit 1;; esac
          if [ "$WAIT_MINUTES" -lt 5 ] || [ "$WAIT_MINUTES" -gt 45 ]; then echo "::error::wait-minutes must be from 5 to 45"; exit 1; fi
          printf '%s' "$REVIEWER" | grep -Eq '^[A-Za-z0-9-]{1,39}$' || { echo "::error::reviewer is not a GitHub login"; exit 1; }

      - name: Mint the driver's organisation token
        id: org
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DRIVER_APP_ID }}
          private-key: ${{ secrets.DRIVER_APP_KEY }}
          owner: kanon-e2e
          permission-administration: write
          permission-contents: write
          permission-workflows: write
          permission-actions: read

      - name: Create the repository, its deploy workflow and its environment
        id: setup
        env:
          GH_TOKEN: ${{ steps.org.outputs.token }}
        run: |
          cd "$RUNNER_TEMP"
          reviewer_id=$(gh api "users/$REVIEWER" --jq .id)
          gh api -X POST "orgs/$ORG/repos" -f name="$REPO_NAME" -F private=false -F auto_init=true \
            -f description="Kanon e2e probe 07; the run that made it deletes it" --jq .full_name
          cat > deploy.yml <<'YAML'
          name: deploy
          on:
            release:
              types: [published]
          permissions: {}
          jobs:
            deploy:
              runs-on: ubuntu-24.04
              timeout-minutes: 5
              environment: probe-07
              steps:
                - run: echo "the approval went through"
          YAML
          gh api -X PUT "repos/$ORG/$REPO_NAME/contents/.github/workflows/deploy.yml" \
            -f message="Add the probe's deploy workflow" -f content="$(base64 -w0 deploy.yml)" --jq .commit.sha
          jq -n --argjson id "$reviewer_id" \
            '{wait_timer: 0, prevent_self_review: true, reviewers: [{type: "User", id: $id}], deployment_branch_policy: null}' > env.json
          gh api -X PUT "repos/$ORG/$REPO_NAME/environments/probe-07" --input env.json \
            --jq '"environment " + .name + ": " + ([.protection_rules[] | .type + (if .prevent_self_review then " (prevent self-review)" else "" end)] | join(", "))'

      - name: Mint the test Releaser's token for the repository
        id: releaser1
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_KEY }}
          owner: kanon-e2e
          repositories: ${{ env.REPO_NAME }}
          permission-contents: write

      - name: Wait for the Releaser's installation to reach the repository
        if: steps.releaser1.outcome == 'failure'
        run: sleep 30

      - name: Mint the test Releaser's token again
        id: releaser2
        if: steps.releaser1.outcome == 'failure'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_KEY }}
          owner: kanon-e2e
          repositories: ${{ env.REPO_NAME }}
          permission-contents: write

      - name: Publish a release as the test Releaser
        env:
          GH_TOKEN: ${{ steps.releaser1.outputs.token || steps.releaser2.outputs.token }}
        run: |
          gh api -X POST "repos/$ORG/$REPO_NAME/releases" -f tag_name=v0.0.1 -f target_commitish=main \
            -f name="probe 07" -f body="Published by the test Releaser for Kanon's e2e probe 07." \
            --jq '"published " + .tag_name + " as " + .author.login'

      - name: Find the deploy run and ask the Owner to approve it
        id: run
        env:
          GH_TOKEN: ${{ steps.org.outputs.token }}
        run: |
          for _ in $(seq 1 36); do
            run=$(gh api "repos/$ORG/$REPO_NAME/actions/runs?event=release&per_page=1" --jq '.workflow_runs[0] | select(.) | [.id, .html_url, .triggering_actor.login] | @tsv')
            [ -n "$run" ] && break
            sleep 5
          done
          [ -n "$run" ] || { echo "::error::the release started no deploy run in 3 minutes"; exit 1; }
          IFS=$'\t' read -r id url actor <<< "$run"
          { echo "id=$id"; echo "url=$url"; echo "actor=$actor"; } >> "$GITHUB_OUTPUT"
          echo "::notice title=Owner, approve now::$REVIEWER: open $url, choose Review deployments, approve probe-07. This run waits $WAIT_MINUTES minutes."
          {
            echo "### Waiting for $REVIEWER's approval"
            echo
            echo "Open [the deploy run]($url) (started by \`$actor\`), choose **Review deployments**, and approve \`probe-07\` within $WAIT_MINUTES minutes. If GitHub offers no approve button, note that and let the wait run out."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the approval
        id: approval
        env:
          GH_TOKEN: ${{ steps.org.outputs.token }}
          RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          deadline=$(( $(date -u +%s) + WAIT_MINUTES * 60 ))
          state=none; by=""
          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            row=$(gh api "repos/$ORG/$REPO_NAME/actions/runs/$RUN_ID/approvals" --jq '.[0] | select(.) | [.state, .user.login] | @tsv')
            if [ -n "$row" ]; then IFS=$'\t' read -r state by <<< "$row"; break; fi
            sleep 20
          done
          sleep 15
          conclusion=$(gh api "repos/$ORG/$REPO_NAME/actions/runs/$RUN_ID" --jq '.status + "/" + (.conclusion // "none")')
          { echo "state=$state"; echo "by=$by"; echo "conclusion=$conclusion"; } >> "$GITHUB_OUTPUT"
          echo "approval: $state by ${by:-nobody}; run: $conclusion"

      - name: Clean up the repository
        if: always() && steps.org.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.org.outputs.token }}
        run: |
          if gh api "repos/$ORG/$REPO_NAME" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$ORG/$REPO_NAME"
            echo "deleted $ORG/$REPO_NAME"
          else
            echo "$ORG/$REPO_NAME does not exist; nothing to delete"
          fi

      - name: Write the answer
        if: always()
        env:
          ACTOR: ${{ steps.run.outputs.actor }}
          STATE: ${{ steps.approval.outputs.state }}
          BY: ${{ steps.approval.outputs.by }}
          CONCLUSION: ${{ steps.approval.outputs.conclusion }}
        run: |
          if [ "$STATE" = approved ] && [ "$BY" = "$REVIEWER" ]; then answer='**PASS**'
          elif [ "$STATE" = none ] || [ -z "$STATE" ]; then answer='**INCONCLUSIVE**: no approval recorded; the Owner says whether GitHub offered the button (probes/README.md)'
          else answer='**FAIL**'; fi
          {
            echo "## Probe 07: the Owner approves the Releaser's deploy"
            echo
            echo "| §12 item | Question | Measured | Answer |"
            echo "|---|---|---|---|"
            echo "| 7 | Can the Owner, as required reviewer with \"Prevent self-review\" on, approve an environment job of a run whose release the test Releaser published? | run started by \`${ACTOR:-unknown}\`; approval: ${STATE:-not reached}${BY:+ by \`$BY\`}; deploy run ended ${CONCLUSION:-unknown} | $answer |"
          } >> "$GITHUB_STEP_SUMMARY"
