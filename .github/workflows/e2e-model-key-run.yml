# e2e — the model key: mint, then the job (Kanon plan 0012 §5.2; harness #16)
#
# CALLED ONLY BY `e2e.yml`'s `model-key`, once for each `claude: subscription` scenario. The
# same spine as the other pairs:
#   • `mint` holds the driver's key and runs nothing else. It mints a token scoped to the one
#     scenario repository with Secrets write and nothing more.
#   • `job` is `e2e-model-key-job.yml`, the one job in environment `e2e-model`, handed the token
#     and the real-model token, and nothing else. It writes the second into the scenario
#     repository as `CLAUDE_CODE_OAUTH_TOKEN` and revokes the first.
# A called workflow sees only the secrets it declares and its caller maps by name (Kanon #1049,
# item 12), so `E2E_CLAUDE_CODE_OAUTH_TOKEN` is declared here and mapped on to the job.
name: e2e — the model key (mint, then the job)

on:
  workflow_call:
    inputs:
      repository-name:
        description: The scenario repository's name in the test organisation
        required: true
        type: string
    secrets:
      DRIVER_APP_ID:
        required: true
      DRIVER_APP_KEY:
        required: true
      E2E_CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  # HOLDS THE KEY, AND ONLY THE MINT.
  mint:
    name: mint (Secrets write)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: e2e
    permissions: {}
    outputs:
      sealed: ${{ steps.seal.outputs.sealed }}
      # The attempt this token was minted for. A partial re-run reuses this job's outputs.
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Mint the driver's Secrets token for the scenario repository
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DRIVER_APP_ID }}
          private-key: ${{ secrets.DRIVER_APP_KEY }}
          owner: kanon-e2e
          repositories: ${{ inputs.repository-name }}
          # The job revokes it when it ends. The default would revoke it as THIS job ends.
          skip-token-revoke: "true"
          permission-secrets: write
      - name: Seal the token for the job
        id: seal
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: printf 'sealed=%s\n' "$(printf %s "$TOKEN" | od -An -v -tx1 | tr -d ' \n')" >> "$GITHUB_OUTPUT"

  # THE JOB, GIVEN THE TOKEN AND NEVER THE KEY.
  job:
    needs: mint
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/e2e-model-key-job.yml
    with:
      repository-name: ${{ inputs.repository-name }}
      mint-attempt: ${{ needs.mint.outputs.attempt }}
    secrets:
      app-token: ${{ needs.mint.outputs.sealed }}
      E2E_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.E2E_CLAUDE_CODE_OAUTH_TOKEN }}
