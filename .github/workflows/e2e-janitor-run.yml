# e2e — the janitor: mint, then the job (Kanon plan 0012 §5.3; harness #16)
#
# CALLED ONLY BY `e2e-janitor.yml`. The same spine as the run's pairs:
#   • `mint` holds the driver's key and runs nothing else. It mints a token for the whole test
#     organisation with Administration write, which deleting a repository takes.
#   • `job` is `e2e-janitor-job.yml`, handed the token and never the key, running the harness's
#     janitor and nothing else.
name: e2e — the janitor (mint, then the job)

on:
  workflow_call:
    secrets:
      DRIVER_APP_ID:
        required: true
      DRIVER_APP_KEY:
        required: true

jobs:
  # HOLDS THE KEY, AND ONLY THE MINT.
  mint:
    name: mint (Administration write)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: e2e
    permissions: {}
    outputs:
      sealed: ${{ steps.seal.outputs.sealed }}
      # The attempt this token was minted for. A partial re-run reuses this job's outputs.
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Mint the driver's organisation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DRIVER_APP_ID }}
          private-key: ${{ secrets.DRIVER_APP_KEY }}
          owner: kanon-e2e
          # The job revokes it when it ends. The default would revoke it as THIS job ends.
          skip-token-revoke: "true"
          permission-administration: write
      - name: Seal the token for the job
        id: seal
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: printf 'sealed=%s\n' "$(printf %s "$TOKEN" | od -An -v -tx1 | tr -d ' \n')" >> "$GITHUB_OUTPUT"

  # THE JOB, GIVEN THE TOKEN AND NEVER THE KEY.
  job:
    needs: mint
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/e2e-janitor-job.yml
    with:
      mint-attempt: ${{ needs.mint.outputs.attempt }}
    secrets:
      app-token: ${{ needs.mint.outputs.sealed }}
