# The project-setup hook (docs/lanes.md): every lane that checks out calls it before the agent.
# `kanon init` wrote the starting point. The harness is a Node project with no database and no
# app (docs/qa/stack.md), so this installs Node and, unless a lane asks for no install, its
# dependencies, which the gates' `npm test` needs. The other inputs are declared because the
# lanes pass them, and unused.
name: Project setup
description: Installs the project for an agent lane.
inputs:
  app-slug:
    description: Passed by Kanon's lanes (docs/lanes.md).
    default: ""
  browsers:
    description: Passed by Kanon's lanes (docs/lanes.md).
    default: ""
  database:
    description: Passed by Kanon's lanes (docs/lanes.md).
    default: ""
  github-token:
    description: Passed by Kanon's lanes (docs/lanes.md).
    default: ""
  install:
    description: Passed by Kanon's lanes (docs/lanes.md).
    default: ""
  issue-number:
    description: Passed by Kanon's lanes (docs/lanes.md).
    default: ""
  lane:
    description: Passed by Kanon's lanes (docs/lanes.md).
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - if: inputs.install != 'false'
      shell: bash
      run: npm ci
