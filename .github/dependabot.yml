version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: "yedeya-labs/kanon*"
    groups:
      kanon:
        patterns:
          - "yedeya-labs/kanon*"
    cooldown:
      default-days: 3
      exclude:
        - "yedeya-labs/kanon*"
    commit-message:
      prefix: ci
      include: scope
